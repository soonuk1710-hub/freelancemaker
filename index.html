<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>프리랜서메이커 - 클라우드 동기화 플래너</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --border-subtle: #e2e8f0;
      --border-strong: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --emerald: #059669;
      --emerald-light: #ecfdf5;
      --emerald-dark: #065f46;
      --amber: #d97706;
      --amber-light: #fffbeb;
      --amber-dark: #b45309;
      --danger: #ef4444;
      --danger-light: #fef2f2;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 4px 12px -2px rgba(0, 0, 0, 0.05), 0 2px 6px -1px rgba(0, 0, 0, 0.02);
      --shadow-lg: 0 14px 30px -4px rgba(0, 0, 0, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.5;
      padding: 24px;
      min-height: 100vh;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      background: var(--bg-card);
      padding: 16px 24px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-sm);
    }

    .app-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      font-size: 22px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }

    .brand-text h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-text p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* 구글 로그인 & 클라우드 상태 UI */
    .auth-section {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-google-login {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      color: var(--text-main);
      border: 1px solid var(--border-strong);
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: var(--shadow-sm);
    }

    .btn-google-login:hover {
      background: #f8fafc;
      border-color: var(--primary);
    }

    .user-profile-bar {
      display: none;
      align-items: center;
      gap: 10px;
      background: var(--bg-main);
      padding: 4px 12px;
      border-radius: 30px;
      border: 1px solid var(--border-subtle);
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid var(--primary);
      object-fit: cover;
    }

    .user-meta {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .user-name {
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .sync-indicator {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 0 2px var(--emerald-light);
    }

    .user-email {
      font-size: 11px;
      color: var(--text-muted);
    }

    .btn-logout {
      background: #fff;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-logout:hover {
      background: var(--danger-light);
      color: var(--danger);
      border-color: #fecaca;
    }

    .btn-routine-open {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fff;
      color: var(--primary);
      border: 1.5px solid var(--primary);
      font-size: 13px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-routine-open:hover {
      background: var(--primary-light);
    }

    /* 3대 핵심 지표 대시보드 */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1.35fr;
      gap: 18px;
    }

    .stat-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 20px;
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .stat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .stat-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .stat-sub {
      font-size: 12px;
      color: var(--text-light);
      font-weight: 500;
    }

    .stat-value {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text-main);
      margin: 4px 0;
    }

    .stat-value.highlight {
      color: var(--emerald);
    }

    .stat-payment-split {
      display: flex;
      gap: 12px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 4px;
      padding-top: 6px;
      border-top: 1px solid #f1f5f9;
    }

    .split-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .split-item.paid { color: var(--emerald); }
    .split-item.unpaid { color: var(--amber); }

    .range-presets {
      display: flex;
      gap: 4px;
    }

    .btn-preset {
      border: 1px solid var(--border-subtle);
      background: var(--bg-main);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-preset:hover {
      background: #fff;
      color: var(--text-main);
    }

    .btn-preset.active {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 700;
    }

    .range-inputs-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 4px 0 6px 0;
    }

    .date-range-input {
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      color: var(--text-main);
      background: #fff;
      outline: none;
      transition: border-color 0.15s ease;
      cursor: pointer;
    }

    .date-range-input:focus {
      border-color: var(--primary);
    }

    .range-sep {
      color: var(--text-light);
      font-size: 12px;
      font-weight: 600;
    }

    /* 차트 */
    .chart-container {
      margin-top: 10px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      height: 55px;
      padding-top: 6px;
      border-top: 1px dashed var(--border-subtle);
    }

    .chart-bar-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      height: 100%;
      justify-content: flex-end;
    }

    .chart-bar-bg {
      width: 100%;
      height: 38px;
      background: #f1f5f9;
      border-radius: 4px;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
      cursor: pointer;
    }

    .chart-bar-fill {
      width: 100%;
      background: #93c5fd;
      border-radius: 4px 4px 0 0;
      transition: height 0.35s ease, background-color 0.2s;
      min-height: 4px;
    }

    .chart-bar-wrap:hover .chart-bar-fill {
      background: var(--primary);
    }

    .chart-label {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 500;
      white-space: nowrap;
    }

    /* 캘린더 */
    .calendar-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .calendar-toolbar {
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-subtle);
      background: #fff;
    }

    .calendar-nav {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .current-month-label {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .btn-group {
      display: flex;
      align-items: center;
      background: var(--bg-main);
      padding: 3px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
    }

    .btn-icon {
      border: none;
      background: transparent;
      padding: 6px 12px;
      cursor: pointer;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      transition: all 0.15s ease;
      font-weight: 700;
    }

    .btn-icon:hover {
      background: #fff;
      color: var(--text-main);
      box-shadow: var(--shadow-sm);
    }

    .btn-today {
      border: 1px solid var(--border-subtle);
      background: #fff;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      padding: 7px 16px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-today:hover {
      background: var(--bg-main);
      border-color: var(--border-strong);
    }

    .calendar-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: #fafbfc;
      border-bottom: 1px solid var(--border-subtle);
      text-align: center;
    }

    .weekday {
      padding: 12px 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .weekday:nth-child(6) { color: #2563eb; }
    .weekday:nth-child(7) { color: #dc2626; }

    .calendar-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: var(--border-subtle);
      gap: 1px;
    }

    .day-cell {
      background: #fff;
      min-height: 114px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: background 0.15s ease;
      position: relative;
    }

    .day-cell:hover {
      background: #f8fafc;
    }

    .day-cell.other-month {
      background: #fafafa;
      opacity: 0.45;
    }

    .day-cell.selected {
      background: #f0f7ff !important;
      outline: 2px solid var(--primary);
      outline-offset: -2px;
      z-index: 2;
    }

    .day-cell-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .day-number {
      font-size: 14px;
      font-weight: 600;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .day-cell.is-today .day-number {
      background: var(--primary);
      color: #fff;
    }

    .day-cell-badges {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 6px;
    }

    .income-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius
