  <script>
    const DEFAULT_FIREBASE_CONFIG = {
      apiKey: "AIzaSyBtdMrIlpv2Yy6vBYHGGbd2UsU1mprDgkw",
      authDomain: "freelance-maker.firebaseapp.com",
      projectId: "freelance-maker",
      storageBucket: "freelance-maker.firebasestorage.app",
      messagingSenderId: "927411375893",
      appId: "1:927411375893:web:a864726b1c9800d937231c",
      measurementId: "G-V51V37Z4V5"
    };

    const LOCAL_CACHE_KEY = 'freelancemaker_tasks_cache_v1';

    let fbApp = null;
    let fbAuth = null;
    let fbDb = null;
    let firestoreUnsubscribe = null;

    let currentUser = null;
    let currentDate = new Date();
    let selectedDate = new Date();
    let tasksData = {};

    let customStartDate = new Date();
    let customEndDate = new Date();
    let currentPreset = '4weeks';

    function initTheme() {
      const isDark = localStorage.getItem('freelancemaker_liquid_dark') === 'true';
      applyDarkMode(isDark);
    }

    function applyDarkMode(isDark) {
      const root = document.documentElement;
      const toggleBtn = document.getElementById('btnDarkModeToggle');
      const iconSpan = toggleBtn.querySelector('.btn-icon');
      const labelSpan = toggleBtn.querySelector('.btn-label');

      if (isDark) {
        root.setAttribute('data-theme', 'dark');
        if (iconSpan) iconSpan.textContent = '☀️';
        if (labelSpan) labelSpan.textContent = '라이트 모드';
      } else {
        root.removeAttribute('data-theme');
        if (iconSpan) iconSpan.textContent = '🌙';
        if (labelSpan) labelSpan.textContent = '다크 모드';
      }
      localStorage.setItem('freelancemaker_liquid_dark', isDark ? 'true' : 'false');
    }

    document.getElementById('btnDarkModeToggle').addEventListener('click', () => {
      const isCurrentlyDark = document.documentElement.getAttribute('data-theme') === 'dark';
      applyDarkMode(!isCurrentlyDark);
    });

    function initFirebase() {
      if (DEFAULT_FIREBASE_CONFIG && !firebase.apps.length) {
        try {
          fbApp = firebase.initializeApp(DEFAULT_FIREBASE_CONFIG);
          fbAuth = firebase.auth();
          fbDb = firebase.firestore();

          const keepLoginCheckbox = document.getElementById('keepLoginCheckbox');
          if (keepLoginCheckbox?.checked) {
            fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
              .catch(err => console.warn('로그인 유지 설정 실패:', err));
          }

          fbAuth.onAuthStateChanged(user => {
            if (user) {
              currentUser = user;
              updateAuthUI(true);
              bindFirestoreSync(user.uid);
            } else {
              currentUser = null;
              updateAuthUI(false);
              if (firestoreUnsubscribe) firestoreUnsubscribe();
              loadLocalData();
            }
          });
        } catch (err) {
          console.error('Firebase 초기화 오류:', err);
          loadLocalData();
        }
      } else {
        loadLocalData();
      }
    }

    function bindFirestoreSync(uid) {
      if (!fbDb) return;
      if (firestoreUnsubscribe) firestoreUnsubscribe();

      const userDocRef = fbDb.collection('freelancers').doc(uid);

      firestoreUnsubscribe = userDocRef.onSnapshot(doc => {
        if (doc.exists) {
          tasksData = doc.data().tasks || {};
        } else {
          const localCache = localStorage.getItem(LOCAL_CACHE_KEY);
          if (localCache) {
            try {
              tasksData = JSON.parse(localCache);
              saveDataToCloud();
            } catch (e) {
              tasksData = {};
            }
          } else {
            tasksData = {};
          }
        }
        localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(tasksData));
        updateDashboardStats();
        renderCalendar();
        if (isDrawerOpen()) renderDrawerTasks();
        if (isUnpaidModalOpen()) renderUnpaidModalList();
        if (isRoutineModalOpen()) renderRoutineList();
      }, err => {
        console.error('Firestore 실시간 동기화 실패:', err);
      });
    }

    function saveData() {
      localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(tasksData));
      updateDashboardStats();
      renderCalendar();
      if (isDrawerOpen()) renderDrawerTasks();
      if (isUnpaidModalOpen()) renderUnpaidModalList();
      if (isRoutineModalOpen()) renderRoutineList();

      if (currentUser && fbDb) {
        saveDataToCloud();
      }
    }

    function saveDataToCloud() {
      if (!currentUser || !fbDb) return;
      fbDb.collection('freelancers').doc(currentUser.uid).set({
        tasks: tasksData,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }).catch(err => {
        console.error('클라우드 동기화 오류:', err);
      });
    }

    function loadLocalData() {
      const stored = localStorage.getItem(LOCAL_CACHE_KEY);
      tasksData = stored ? JSON.parse(stored) : {};
      updateDashboardStats();
      renderCalendar();
      if (isDrawerOpen()) renderDrawerTasks();
    }

    async function handleGoogleLogin() {
      if (!fbAuth) {
        alert('인증 프로바이더를 사용할 수 없습니다.');
        return;
      }

      const provider = new firebase.auth.GoogleAuthProvider();
      const keepLogin = document.getElementById('keepLoginCheckbox')?.checked ?? true;
      const persistence = keepLogin
        ? firebase.auth.Auth.Persistence.LOCAL
        : firebase.auth.Auth.Persistence.SESSION;

      try {
        await fbAuth.setPersistence(persistence);
        await fbAuth.signInWithPopup(provider);
      } catch (error) {
        if (error.code !== 'auth/popup-closed-by-user') {
          alert('구글 로그인 오류: ' + error.message);
        }
      }
    }

    async function handleLogout() {
      if (fbAuth) {
        await fbAuth.signOut();
      }
    }

    function updateAuthUI(isLoggedIn) {
      const btnLogin = document.getElementById('btnGoogleLogin');
      const profileBar = document.getElementById('userProfileBar');

      if (isLoggedIn && currentUser) {
        btnLogin.style.display = 'none';
        profileBar.style.display = 'flex';
        document.getElementById('userAvatar').src = currentUser.photoURL || '';
        document.getElementById('userName').textContent = currentUser.displayName || '프리랜서';
        document.getElementById('userEmail').textContent = currentUser.email || '';
      } else {
        btnLogin.style.display = 'inline-flex';
        profileBar.style.display = 'none';
      }
    }

    function formatDateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function parseDateKey(str) {
      const [y, m, d] = str.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function formatKRW(num) {
      return '₩' + (Number(num) || 0).toLocaleString('ko-KR');
    }

    function parseNumber(str) {
      if (!str) return 0;
      const clean = String(str).replace(/[^0-9]/g, '');
      return clean ? parseInt(clean, 10) : 0;
    }

    function cloneDate(d) {
      return new Date(d.getTime());
    }

    function getTaskEffectiveAmount(task) {
      const raw = Number(task.amount) || 0;
      return task.taxDeduction ? Math.round(raw * 0.967) : raw;
    }

    function calculateIncomeMetrics(tasks) {
      let total = 0;
      let paid = 0;
      let unpaid = 0;

      tasks.forEach(t => {
        const amt = getTaskEffectiveAmount(t);
        total += amt;
        if (t.isPaid) paid += amt;
        else unpaid += amt;
      });

      return { total, paid, unpaid, count: tasks.length };
    }

    function getDailyMetrics(date) {
      const key = formatDateKey(date);
      return calculateIncomeMetrics(tasksData[key] || []);
    }

    function getWeekRange(targetDate) {
      const date = new Date(targetDate);
      const day = date.getDay();
      const diffToMon = day === 0 ? -6 : 1 - day;
      const mon = new Date(date);
      mon.setDate(date.getDate() + diffToMon);
      mon.setHours(0, 0, 0, 0);

      const sun = new Date(mon);
      sun.setDate(mon.getDate() + 6);
      sun.setHours(23, 59, 59, 999);
      return { mon, sun };
    }

    function getWeeklyMetrics(targetDate) {
      const { mon, sun } = getWeekRange(targetDate);
      let allTasks = [];
      let cur = new Date(mon);

      while (cur <= sun) {
        const key = formatDateKey(cur);
        if (tasksData[key]) allTasks = allTasks.concat(tasksData[key]);
        cur.setDate(cur.getDate() + 1);
      }
      return { ...calculateIncomeMetrics(allTasks), mon, sun };
    }

    function getCustomRangeMetrics(start, end) {
      const s = new Date(start); s.setHours(0, 0, 0, 0);
      const e = new Date(end); e.setHours(23, 59, 59, 999);

      const diffTime = Math.abs(e - s);
      const dayCount = Math.max(1, Math.round(diffTime / (1000 * 60 * 60 * 24)) + 1);

      let allTasks = [];
      const dailyMap = {};
      let cur = new Date(s);

      while (cur <= e) {
        const key = formatDateKey(cur);
        const tasks = tasksData[key] || [];
        allTasks = allTasks.concat(tasks);
        dailyMap[key] = tasks.reduce((acc, item) => acc + getTaskEffectiveAmount(item), 0);
        cur.setDate(cur.getDate() + 1);
      }

      const summary = calculateIncomeMetrics(allTasks);

      let bucketCount = dayCount <= 7 ? dayCount : 5;
      const buckets = [];
      const bucketSizeDays = Math.ceil(dayCount / bucketCount);

      let bStart = new Date(s);
      for (let i = 0; i < bucketCount; i++) {
        if (bStart > e) break;
        let bEnd = new Date(bStart);
        bEnd.setDate(bStart.getDate() + bucketSizeDays - 1);
        if (bEnd > e) bEnd = new Date(e);

        let sum = 0;
        let walk = new Date(bStart);
        while (walk <= bEnd) {
          sum += dailyMap[formatDateKey(walk)] || 0;
          walk.setDate(walk.getDate() + 1);
        }

        let label = dayCount <= 7 
          ? `${bStart.getMonth() + 1}.${bStart.getDate()}` 
          : `${bStart.getMonth() + 1}.${bStart.getDate()}~`;

        buckets.push({
          label,
          fullLabel: `${formatDateKey(bStart)} ~ ${formatDateKey(bEnd)}: ${formatKRW(sum)}`,
          sum
        });

        bStart.setDate(bStart.getDate() + bucketSizeDays);
      }

      return { ...summary, dayCount, buckets };
    }

    function updateDashboardStats() {
      const daily = getDailyMetrics(selectedDate);
      document.getElementById('dailyIncomeValue').textContent = formatKRW(daily.total);
      document.getElementById('dailyDateLabel').textContent = `${selectedDate.getFullYear()}.${selectedDate.getMonth() + 1}.${selectedDate.getDate()}`;
      document.getElementById('dailyPaidValue').textContent = formatKRW(daily.paid);
      document.getElementById('dailyUnpaidValue').textContent = formatKRW(daily.unpaid);

      const weekly = getWeeklyMetrics(selectedDate);
      document.getElementById('weeklyIncomeValue').textContent = formatKRW(weekly.total);
      document.getElementById('weeklyRangeLabel').textContent = 
        `${weekly.mon.getMonth() + 1}.${weekly.mon.getDate()} ~ ${weekly.sun.getMonth() + 1}.${weekly.sun.getDate()}`;
      document.getElementById('weeklyPaidValue').textContent = formatKRW(weekly.paid);
      document.getElementById('weeklyUnpaidValue').textContent = formatKRW(weekly.unpaid);

      updateCustomRangeDisplay();
    }

    function updateCustomRangeDisplay() {
      const range = getCustomRangeMetrics(customStartDate, customEndDate);

      document.getElementById('rangeIncomeValue').textContent = formatKRW(range.total);
      document.getElementById('rangePaidValue').textContent = formatKRW(range.paid);
      document.getElementById('rangeUnpaidValue').textContent = formatKRW(range.unpaid);
      document.getElementById('rangeMetaInfo').textContent = `${range.dayCount}일간 · ${range.count}건`;

      const chartContainer = document.getElementById('chartContainer');
      chartContainer.innerHTML = '';
      const maxVal = Math.max(...range.buckets.map(b => b.sum), 1);

      range.buckets.forEach(b => {
        const wrap = document.createElement('div');
        wrap.className = 'chart-pipe-wrap';

        const tube = document.createElement('div');
        tube.className = 'chart-pipe-tube';
        tube.title = b.fullLabel;

        const fluid = document.createElement('div');
        fluid.className = 'chart-pipe-fluid';
        const pct = Math.max(6, Math.round((b.sum / maxVal) * 100));
        fluid.style.height = `${pct}%`;

        tube.appendChild(fluid);

        const label = document.createElement('span');
        label.className = 'chart-pipe-label';
        label.textContent = b.label;

        wrap.appendChild(tube);
        wrap.appendChild(label);
        chartContainer.appendChild(wrap);
      });
    }

    function applyPreset(presetName) {
      const today = new Date();
      currentPreset = presetName;

      document.querySelectorAll('.range-selector .btn-preset').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.preset === presetName);
      });

      if (presetName === '4weeks') {
        customEndDate = cloneDate(today);
        customStartDate = cloneDate(today);
        customStartDate.setDate(today.getDate() - 27);
      } else if (presetName === 'thisMonth') {
        customStartDate = new Date(today.getFullYear(), today.getMonth(), 1);
        customEndDate = new Date(today.getFullYear(), today.getMonth() + 1, 0);
      } else if (presetName === 'lastMonth') {
        customStartDate = new Date(today.getFullYear(), today.getMonth() - 1, 1);
        customEndDate = new Date(today.getFullYear(), today.getMonth(), 0);
      }

      document.getElementById('rangeStartDate').value = formatDateKey(customStartDate);
      document.getElementById('rangeEndDate').value = formatDateKey(customEndDate);
      updateCustomRangeDisplay();
    }

    function renderCalendar() {
      const calendarDays = document.getElementById('calendarDays');
      calendarDays.innerHTML = '';

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      document.getElementById('currentMonthLabel').textContent = `${year}년 ${month + 1}월`;

      const firstDayOfMonth = new Date(year, month, 1);
      const lastDayOfMonth = new Date(year, month + 1, 0);

      let startDayOfWeek = firstDayOfMonth.getDay() - 1;
      if (startDayOfWeek === -1) startDayOfWeek = 6;

      const prevMonthLastDate = new Date(year, month, 0).getDate();
      for (let i = startDayOfWeek - 1; i >= 0; i--) {
        const dayNum = prevMonthLastDate - i;
        calendarDays.appendChild(createDayCell(new Date(year, month - 1, dayNum), true));
      }

      for (let day = 1; day <= lastDayOfMonth.getDate(); day++) {
        calendarDays.appendChild(createDayCell(new Date(year, month, day), false));
      }

      const totalRendered = startDayOfWeek + lastDayOfMonth.getDate();
      const nextDaysCount = (7 - (totalRendered % 7)) % 7;
      for (let i = 1; i <= nextDaysCount; i++) {
        calendarDays.appendChild(createDayCell(new Date(year, month + 1, i), true));
      }
    }

    function createDayCell(date, isOtherMonth) {
      const cell = document.createElement('div');
      cell.className = 'calendar-day-tile' + (isOtherMonth ? ' other-month' : '');

      const dateKey = formatDateKey(date);
      const todayKey = formatDateKey(new Date());
      const selectedKey = formatDateKey(selectedDate);

      if (dateKey === todayKey) cell.classList.add('is-today');
      if (dateKey === selectedKey) cell.classList.add('selected');

      const items = tasksData[dateKey] || [];
      const metrics = calculateIncomeMetrics(items);
      const completedCount = items.filter(t => t.done).length;
      const inProgressCount = items.length - completedCount;

      const topDiv = document.createElement('div');
      topDiv.className = 'tile-top-row';
      const numSpan = document.createElement('span');
      numSpan.className = 'tile-day-pill';
      numSpan.textContent = date.getDate();
      topDiv.appendChild(numSpan);
      cell.appendChild(topDiv);

      const badgeContainer = document.createElement('div');
      badgeContainer.className = 'tile-badges-stack';

      if (metrics.total > 0) {
        const incPill = document.createElement('div');
        incPill.className = `tile-revenue-chip ${metrics.unpaid > 0 ? 'has-unpaid' : 'all-paid'}`;
        incPill.title = `실수령액: ${formatKRW(metrics.total)} (미입금: ${formatKRW(metrics.unpaid)})`;
        incPill.innerHTML = `<span>+${formatKRW(metrics.total)}</span>${metrics.unpaid > 0 ? '<span style="font-size:9.5px; opacity:0.9">미입금</span>' : ''}`;
        badgeContainer.appendChild(incPill);
      }

      if (items.length > 0) {
        if (inProgressCount > 0) {
          const progBadge = document.createElement('div');
          progBadge.className = 'tile-task-chip';
          progBadge.innerHTML = `<span class="chip-neon-dot"></span> 진행 ${inProgressCount}건`;
          badgeContainer.appendChild(progBadge);
        }
        if (completedCount > 0) {
          const doneBadge = document.createElement('div');
          doneBadge.className = 'tile-task-chip';
          doneBadge.innerHTML = `<span class="chip-neon-dot done"></span> 완료 ${completedCount}건`;
          badgeContainer.appendChild(doneBadge);
        }
      }

      cell.appendChild(badgeContainer);

      cell.addEventListener('click', () => {
        selectedDate = new Date(date);
        updateDashboardStats();
        renderCalendar();
        openDrawer();
      });

      return cell;
    }

    function setupCalculator(unitPriceInputId, countInputId, totalAmountInputId, isRoutine) {
      const unitInput = document.getElementById(unitPriceInputId);
      const countInput = document.getElementById(countInputId);
      const totalInput = document.getElementById(totalAmountInputId);

      function recalc() {
        const unit = parseNumber(unitInput.value);
        const count = Math.max(1, parseInt(countInput.value, 10) || 1);
        const total = unit * count;
        totalInput.value = total > 0 ? total.toLocaleString('ko-KR') : '';

        if (!isRoutine) {
          updateNetIncomeDisplay();
        }
      }

      unitInput.addEventListener('input', e => {
        const raw = parseNumber(e.target.value);
        e.target.value = raw ? raw.toLocaleString('ko-KR') : '';
        recalc();
      });

      countInput.addEventListener('input', recalc);

      totalInput.addEventListener('input', e => {
        const raw = parseNumber(e.target.value);
        e.target.value = raw ? raw.toLocaleString('ko-KR') : '';
        if (!isRoutine) updateNetIncomeDisplay();
      });
    }

    function updateNetIncomeDisplay() {
      const total = parseNumber(document.getElementById('taskAmount').value);
      const isTax = document.getElementById('taskTaxDeduction').checked;
      const display = document.getElementById('taskNetIncomeDisplay');

      if (isTax && total > 0) {
        const net = Math.round(total * 0.967);
        display.textContent = `실수령 ₩${net.toLocaleString('ko-KR')} (공제 ₩${Math.round(total * 0.033).toLocaleString('ko-KR')})`;
      } else {
        display.textContent = '';
      }
    }

    document.getElementById('taskTaxDeduction').addEventListener('change', updateNetIncomeDisplay);

    setupCalculator('taskUnitPrice', 'taskCount', 'taskAmount', false);
    setupCalculator('routineUnitPrice', 'routineCount', 'routineAmount', true);

    function isDrawerOpen() {
      return document.getElementById('drawerOverlay').classList.contains('active');
    }

    function openDrawer() {
      document.getElementById('drawerOverlay').classList.add('active');
      renderDrawerTasks();
      resetForm();
    }

    function syncTaskDateInput() {
      const input = document.getElementById('taskDate');
      if (input) input.value = formatDateKey(selectedDate);
    }

    function closeDrawer() {
      document.getElementById('drawerOverlay').classList.remove('active');
      resetForm();
    }

    function renderDrawerTasks() {
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      const year = selectedDate.getFullYear();
      const month = selectedDate.getMonth() + 1;
      const date = selectedDate.getDate();
      const dayName = days[selectedDate.getDay()];

      document.getElementById('drawerDateTitle').textContent = `${year}년 ${month}월 ${date}일 (${dayName})`;

      const key = formatDateKey(selectedDate);
      const list = tasksData[key] || [];
      const metrics = calculateIncomeMetrics(list);

      document.getElementById('drawerDailyTotal').textContent = `총 ${formatKRW(metrics.total)}`;
      document.getElementById('drawerPaidTotal').textContent = `입금 ${formatKRW(metrics.paid)}`;
      document.getElementById('drawerUnpaidTotal').textContent = `미입금 ${formatKRW(metrics.unpaid)}`;

      const container = document.getElementById('taskList');
      container.innerHTML = '';

      if (list.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:32px 12px; color:var(--text-light); font-size:13px; font-weight:600;">등록된 업무가 없습니다.</div>';
        return;
      }

      list.forEach(task => {
        const item = document.createElement('div');
        item.className = `task-item-tile ${task.done ? 'completed' : ''}`;

        const checkWrap = document.createElement('div');
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'glass-check';
        checkbox.checked = task.done;
        checkbox.setAttribute('aria-label', '완료 처리');
        checkbox.addEventListener('change', () => toggleTaskDone(task.id));
        checkWrap.appendChild(checkbox);

        const details = document.createElement('div');
        details.className = 'task-details';

        const titleLine = document.createElement('div');
        titleLine.className = 'task-title-line';

        const title = document.createElement('span');
        title.className = 'task-name-text';
        title.textContent = task.title;
        titleLine.appendChild(title);

        if (task.isRoutine) {
          const rBadge = document.createElement('span');
          rBadge.className = 'pill-badge';
          rBadge.style.fontSize = '10px';
          rBadge.style.padding = '2px 8px';
          rBadge.textContent = '루틴';
          titleLine.appendChild(rBadge);
        }

        if (task.taxDeduction) {
          const tBadge = document.createElement('span');
          tBadge.className = 'pill-badge';
          tBadge.style.fontSize = '10px';
          tBadge.style.padding = '2px 8px';
          tBadge.textContent = '3.3% 공제';
          titleLine.appendChild(tBadge);
        }

        details.appendChild(titleLine);

        if (task.unitPrice > 0 || task.count > 1) {
          const calcInfo = document.createElement('div');
          calcInfo.className = 'task-calc-info';
          calcInfo.textContent = `단가: ${formatKRW(task.unitPrice || task.amount)} × ${task.count || 1}건`;
          details.appendChild(calcInfo);
        }

        if (task.memo && task.memo.trim() !== '') {
          const memo = document.createElement('div');
          memo.className = 'task-memo-text';
          memo.textContent = task.memo;
          details.appendChild(memo);
        }

        const bottomMeta = document.createElement('div');
        bottomMeta.className = 'task-bottom-meta';

        const amtBox = document.createElement('div');
        const effectiveAmt = getTaskEffectiveAmount(task);
        const amount = document.createElement('div');
        amount.className = 'task-income-amt';
        amount.textContent = `+${formatKRW(effectiveAmt)}`;
        amtBox.appendChild(amount);

        if (task.taxDeduction) {
          const net = document.createElement('div');
          net.style.cssText = 'font-size:11px; color:var(--text-light); font-weight:700; font-family:var(--font-mono);';
          net.textContent = `(원금 ${formatKRW(task.amount)} · 세후)`;
          amtBox.appendChild(net);
        }

        bottomMeta.appendChild(amtBox);

        const payToggle = document.createElement('label');
        payToggle.className = `payment-check-toggle ${task.isPaid ? 'paid' : 'unpaid'}`;
        payToggle.title = '클릭하여 입금 상태 변경';

        const payCheck = document.createElement('input');
        payCheck.type = 'checkbox';
        payCheck.className = 'payment-check-box';
        payCheck.checked = !!task.isPaid;
        payCheck.addEventListener('change', e => {
          e.stopPropagation();
          togglePaymentStatus(task.id, selectedDate);
        });

        const payText = document.createElement('span');
        payText.className = 'payment-status-text';
        payText.textContent = task.isPaid ? '입금완료' : '미입금';

        payToggle.appendChild(payCheck);
        payToggle.appendChild(payText);
        bottomMeta.appendChild(payToggle);

        details.appendChild(bottomMeta);

        const actions = document.createElement('div');
        actions.style.display = 'flex';
        actions.style.gap = '4px';

        const editBtn = document.createElement('button');
        editBtn.className = 'btn-login-pill';
        editBtn.style.padding = '4px 8px';
        editBtn.style.fontSize = '11px';
        editBtn.style.background = 'var(--glass-bg)';
        editBtn.style.color = 'var(--text-main)';
        editBtn.textContent = '수정';
        editBtn.addEventListener('click', () => startEditTask(task));

        const delBtn = document.createElement('button');
        delBtn.className = 'btn-login-pill';
        delBtn.style.padding = '4px 8px';
        delBtn.style.fontSize = '11px';
        delBtn.style.background = 'rgba(225, 29, 72, 0.14)';
        delBtn.style.color = 'var(--accent-rose)';
        delBtn.style.borderColor = 'rgba(225, 29, 72, 0.35)';
        delBtn.textContent = '삭제';
        delBtn.addEventListener('click', () => deleteTask(task.id));

        actions.appendChild(editBtn);
        actions.appendChild(delBtn);

        item.appendChild(checkWrap);
        item.appendChild(details);
        item.appendChild(actions);

        container.appendChild(item);
      });
    }

    function toggleTaskDone(taskId) {
      const key = formatDateKey(selectedDate);
      if (!tasksData[key]) return;
      const task = tasksData[key].find(t => t.id === taskId);
      if (task) {
        task.done = !task.done;
        saveData();
      }
    }

    function togglePaymentStatus(taskId, targetDate) {
      const key = formatDateKey(targetDate || selectedDate);
      if (!tasksData[key]) return;
      const task = tasksData[key].find(t => t.id === taskId);
      if (task) {
        task.isPaid = !task.isPaid;
        saveData();
      }
    }

    function deleteTask(taskId) {
      if (!confirm('이 업무를 삭제하시겠습니까?')) return;
      const key = formatDateKey(selectedDate);
      if (!tasksData[key]) return;
      tasksData[key] = tasksData[key].filter(t => t.id !== taskId);
      if (tasksData[key].length === 0) delete tasksData[key];
      saveData();
    }

    function startEditTask(task) {
      document.getElementById('formModeTitle').textContent = '✦ 업무 내용 수정';
      document.getElementById('editingTaskId').value = task.id;
      document.getElementById('taskDate').value = formatDateKey(selectedDate);
      document.getElementById('taskTitle').value = task.title;
      
      const unit = task.unitPrice !== undefined ? task.unitPrice : task.amount;
      const count = task.count || 1;
      document.getElementById('taskUnitPrice').value = unit ? Number(unit).toLocaleString('ko-KR') : '';
      document.getElementById('taskCount').value = count;
      document.getElementById('taskAmount').value = task.amount ? Number(task.amount).toLocaleString('ko-KR') : '';
      document.getElementById('taskTaxDeduction').checked = Boolean(task.taxDeduction);
      document.getElementById('taskIsPaid').checked = Boolean(task.isPaid);
      document.getElementById('taskMemo').value = task.memo || '';
      
      updateNetIncomeDisplay();
      document.getElementById('btnSubmit').textContent = '수정 내용 저장';
      document.getElementById('btnCancelEdit').style.display = 'inline-flex';
    }

    function resetForm() {
      document.getElementById('formModeTitle').textContent = '✦ 새 업무 등록';
      document.getElementById('editingTaskId').value = '';
      syncTaskDateInput();
      document.getElementById('taskTitle').value = '';
      document.getElementById('taskUnitPrice').value = '';
      document.getElementById('taskCount').value = '1';
      document.getElementById('taskAmount').value = '';
      document.getElementById('taskTaxDeduction').checked = false;
      document.getElementById('taskNetIncomeDisplay').textContent = '';
      document.getElementById('taskIsPaid').checked = false;
      document.getElementById('taskMemo').value = '';
      document.getElementById('btnSubmit').textContent = '업무 등록 확정';
      document.getElementById('btnCancelEdit').style.display = 'none';
    }

    document.getElementById('taskForm').addEventListener('submit', e => {
      e.preventDefault();
      const title = document.getElementById('taskTitle').value.trim();
      const unitPrice = parseNumber(document.getElementById('taskUnitPrice').value);
      const count = Math.max(1, parseInt(document.getElementById('taskCount').value, 10) || 1);
      let amount = parseNumber(document.getElementById('taskAmount').value);
      if (!amount && unitPrice) amount = unitPrice * count;

      const taxDeduction = document.getElementById('taskTaxDeduction').checked;
      const isPaid = document.getElementById('taskIsPaid').checked;
      const memo = document.getElementById('taskMemo').value.trim();
      const editingId = document.getElementById('editingTaskId').value;
      const sourceDateKey = formatDateKey(selectedDate);
      const targetDateKey = document.getElementById('taskDate').value || sourceDateKey;

      if (!title || !targetDateKey) return;

      if (editingId) {
        const sourceList = tasksData[sourceDateKey] || [];
        const sourceIndex = sourceList.findIndex(t => t.id === editingId);

        if (sourceIndex === -1) return;

        const [target] = sourceList.splice(sourceIndex, 1);
        const updatedTask = {
          ...target,
          title,
          unitPrice,
          count,
          amount,
          taxDeduction,
          isPaid,
          memo
        };

        if (targetDateKey !== sourceDateKey) {
          if (sourceList.length === 0) delete tasksData[sourceDateKey];
          if (!tasksData[targetDateKey]) tasksData[targetDateKey] = [];
          tasksData[targetDateKey].push(updatedTask);
          selectedDate = parseDateKey(targetDateKey);
        } else {
          sourceList.push(updatedTask);
        }
      } else {
        if (!tasksData[targetDateKey]) tasksData[targetDateKey] = [];
        tasksData[targetDateKey].push({
          id: 'task_' + Math.random().toString(36).substring(2, 9),
          title,
          unitPrice,
          count,
          amount,
          taxDeduction,
          isPaid,
          memo,
          done: false,
          isRoutine: false
        });

        if (targetDateKey !== sourceDateKey) {
          selectedDate = parseDateKey(targetDateKey);
        }
      }

      saveData();
      resetForm();
      renderCalendar();
      if (isDrawerOpen()) renderDrawerTasks();
    });

    document.getElementById('btnCancelEdit').addEventListener('click', resetForm);

    const routineModal = document.getElementById('routineModalOverlay');

    function isRoutineModalOpen() {
      return routineModal.classList.contains('active');
    }

    function openRoutineModal() {
      switchRoutineTab('list');
      renderRoutineList();
      routineModal.classList.add('active');
    }

    function closeRoutineModal() {
      routineModal.classList.remove('active');
      resetRoutineForm();
    }

    function switchRoutineTab(tab) {
      const isList = tab === 'list';
      document.getElementById('tabBtnRoutineList').classList.toggle('active', isList);
      document.getElementById('tabBtnRoutineCreate').classList.toggle('active', !isList);
      document.getElementById('paneRoutineList').style.display = isList ? 'flex' : 'none';
      document.getElementById('routineForm').style.display = isList ? 'none' : 'flex';

      if (isList) {
        resetRoutineForm();
        renderRoutineList();
      }
    }

    document.getElementById('tabBtnRoutineList').addEventListener('click', () => switchRoutineTab('list'));
    document.getElementById('tabBtnRoutineCreate').addEventListener('click', () => {
      resetRoutineForm();
      switchRoutineTab('create');
    });

    function resetRoutineForm() {
      document.getElementById('editingRoutineGroupId').value = '';
      document.getElementById('routineForm').reset();
      document.getElementById('routineCount').value = '1';
      document.getElementById('tabBtnRoutineCreate').textContent = '+ 새 루틴 등록';
      document.getElementById('routineRepeatConfigSection').style.display = 'block';
      document.getElementById('btnSubmitRoutine').textContent = '일정 일괄 생성';
      document.getElementById('btnCancelEditRoutine').style.display = 'none';

      // 시작일자(오늘) 및 종료일자(기본 3개월) 자동 초기화
      const today = new Date();
      document.getElementById('routineStartDate').value = formatDateKey(today);
      const threeMonthsLater = new Date(today);
      threeMonthsLater.setMonth(today.getMonth() + 3);
      document.getElementById('routineEndDate').value = formatDateKey(threeMonthsLater);

      document.querySelectorAll('.weekday-pill').forEach((chip, idx) => {
        chip.classList.toggle('active', idx === 0);
      });

      document.querySelectorAll('.btn-routine-preset').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.months === '3');
      });
    }

    function renderRoutineList() {
      const container = document.getElementById('routineGroupList');
      container.innerHTML = '';

      const routineGroups = {};

      Object.keys(tasksData).forEach(dateKey => {
        (tasksData[dateKey] || []).forEach(task => {
          if (task.isRoutine) {
            const groupKey = task.routineGroupId || `legacy_${task.title}_${task.amount}`;
            if (!routineGroups[groupKey]) {
              routineGroups[groupKey] = {
                groupKey,
                title: task.title,
                amount: task.amount,
                unitPrice: task.unitPrice,
                count: task.count,
                taxDeduction: task.taxDeduction,
                memo: task.memo || '',
                itemsCount: 0,
                firstDate: dateKey,
                lastDate: dateKey
              };
            }
            routineGroups[groupKey].itemsCount++;
            if (dateKey < routineGroups[groupKey].firstDate) routineGroups[groupKey].firstDate = dateKey;
            if (dateKey > routineGroups[groupKey].lastDate) routineGroups[groupKey].lastDate = dateKey;
          }
        });
      });

      const groupArray = Object.values(routineGroups);

      if (groupArray.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:36px; color:var(--text-light); font-size:13px; font-weight:600;">등록된 루틴 업무가 없습니다.</div>';
        return;
      }

      groupArray.forEach(group => {
        const card = document.createElement('div');
        card.className = 'task-item-tile';

        const info = document.createElement('div');
        info.style.flex = '1';

        const titleDiv = document.createElement('div');
        titleDiv.className = 'task-title-line';
        titleDiv.innerHTML = `
          <span class="task-name-text">${group.title}</span>
          <span class="pill-badge">${group.itemsCount}건</span>
          ${group.taxDeduction ? '<span class="pill-badge">3.3% 공제</span>' : ''}
        `;

        const metaDiv = document.createElement('div');
        metaDiv.className = 'task-calc-info';
        const displayAmt = group.taxDeduction ? Math.round(group.amount * 0.967) : group.amount;
        metaDiv.textContent = `1회: ${formatKRW(displayAmt)} · 등록 기간: ${group.firstDate} ~ ${group.lastDate}`;

        info.appendChild(titleDiv);
        info.appendChild(metaDiv);

        const actions = document.createElement('div');
        actions.style.display = 'flex';
        actions.style.gap = '6px';

        const editBtn = document.createElement('button');
        editBtn.type = 'button';
        editBtn.className = 'btn-login-pill';
        editBtn.style.padding = '5px 10px';
        editBtn.style.fontSize = '11px';
        editBtn.style.background = 'var(--glass-bg)';
        editBtn.style.color = 'var(--text-main)';
        editBtn.textContent = '수정';
        editBtn.addEventListener('click', () => startEditRoutineGroup(group));

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'btn-login-pill';
        delBtn.style.padding = '5px 10px';
        delBtn.style.fontSize = '11px';
        delBtn.style.background = 'rgba(225, 29, 72, 0.14)';
        delBtn.style.color = 'var(--accent-rose)';
        delBtn.style.borderColor = 'rgba(225, 29, 72, 0.35)';
        delBtn.textContent = '삭제';
        delBtn.addEventListener('click', () => deleteRoutineGroup(group.groupKey, group.title, group.itemsCount));

        actions.appendChild(editBtn);
        actions.appendChild(delBtn);

        card.appendChild(info);
        card.appendChild(actions);
        container.appendChild(card);
      });
    }

    function startEditRoutineGroup(group) {
      switchRoutineTab('create');
      document.getElementById('tabBtnRoutineCreate').textContent = '루틴 수정';
      document.getElementById('editingRoutineGroupId').value = group.groupKey;
      document.getElementById('routineTitle').value = group.title;

      const unit = group.unitPrice !== undefined ? group.unitPrice : group.amount;
      const count = group.count || 1;
      document.getElementById('routineUnitPrice').value = unit ? Number(unit).toLocaleString('ko-KR') : '';
      document.getElementById('routineCount').value = count;
      document.getElementById('routineAmount').value = group.amount ? Number(group.amount).toLocaleString('ko-KR') : '';
      document.getElementById('routineTaxDeduction').checked = Boolean(group.taxDeduction);
      document.getElementById('routineMemo').value = group.memo || '';

      document.getElementById('routineRepeatConfigSection').style.display = 'none';
      document.getElementById('btnSubmitRoutine').textContent = `일괄 수정 완료 (${group.itemsCount}건)`;
      document.getElementById('btnCancelEditRoutine').style.display = 'inline-flex';
    }

    document.getElementById('btnCancelEditRoutine').addEventListener('click', () => {
      switchRoutineTab('list');
    });

    function deleteRoutineGroup(groupKey, title, count) {
      if (!confirm(`'${title}' 루틴으로 생성된 모든 일정(총 ${count}건)을 캘린더에서 전부 삭제하시겠습니까?`)) {
        return;
      }

      Object.keys(tasksData).forEach(dateKey => {
        tasksData[dateKey] = (tasksData[dateKey] || []).filter(task => {
          if (!task.isRoutine) return true;
          const currentGroupKey = task.routineGroupId || `legacy_${task.title}_${task.amount}`;
          return currentGroupKey !== groupKey;
        });

        if (tasksData[dateKey].length === 0) {
          delete tasksData[dateKey];
        }
      });

      saveData();
      renderRoutineList();
    }

    document.getElementById('openRoutineModalBtn').addEventListener('click', openRoutineModal);
    document.getElementById('closeRoutineModalBtn').addEventListener('click', closeRoutineModal);
    routineModal.addEventListener('click', e => {
      if (e.target.id === 'routineModalOverlay') closeRoutineModal();
    });

    document.querySelectorAll('.weekday-pill').forEach(chip => {
      chip.addEventListener('click', () => chip.classList.toggle('active'));
    });

    // 루틴 기간 프리셋 버튼 연동 (시작일 유지 및 종료일 갱신)
    document.querySelectorAll('.btn-routine-preset').forEach(btn => {
      btn.addEventListener('click', () => {
        const months = parseInt(btn.dataset.months, 10);
        if (isNaN(months)) return;

        document.querySelectorAll('.btn-routine-preset').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        let startVal = document.getElementById('routineStartDate').value;
        let s = startVal ? parseDateKey(startVal) : new Date();
        document.getElementById('routineStartDate').value = formatDateKey(s);

        let e = new Date(s);
        e.setMonth(s.getMonth() + months);
        document.getElementById('routineEndDate').value = formatDateKey(e);
      });
    });

    // 시작 날짜 변경 시 종료 날짜 자동 연동
    const routineStartInput = document.getElementById('routineStartDate');
    const routineEndInput = document.getElementById('routineEndDate');

    routineStartInput.addEventListener('change', () => {
      const sVal = routineStartInput.value;
      if (!sVal) return;
      const s = parseDateKey(sVal);

      const activePreset = document.querySelector('.btn-routine-preset.active');
      const months = activePreset ? parseInt(activePreset.dataset.months, 10) : 3;

      const e = new Date(s);
      e.setMonth(s.getMonth() + months);
      routineEndInput.value = formatDateKey(e);
    });

    // 모든 날짜 입력창 클릭 시 캘린더 팝업 호출
    document.querySelectorAll('input[type="date"]').forEach(input => {
      input.addEventListener('click', function() {
        try {
          if (typeof this.showPicker === 'function') {
            this.showPicker();
          }
        } catch (e) {}
      });
    });

    document.getElementById('routineForm').addEventListener('submit', e => {
      e.preventDefault();
      const editingGroupId = document.getElementById('editingRoutineGroupId').value;
      const title = document.getElementById('routineTitle').value.trim();
      const unitPrice = parseNumber(document.getElementById('routineUnitPrice').value);
      const count = Math.max(1, parseInt(document.getElementById('routineCount').value, 10) || 1);
      let amount = parseNumber(document.getElementById('routineAmount').value);
      if (!amount && unitPrice) amount = unitPrice * count;

      const taxDeduction = document.getElementById('routineTaxDeduction').checked;
      const memo = document.getElementById('routineMemo').value.trim();

      if (!title) {
        alert('업무명을 입력해주세요.');
        document.getElementById('routineTitle').focus();
        return;
      }

      if (editingGroupId) {
        let updatedCount = 0;
        Object.keys(tasksData).forEach(dateKey => {
          (tasksData[dateKey] || []).forEach(task => {
            const currentGroupKey = task.routineGroupId || `legacy_${task.title}_${task.amount}`;
            if (task.isRoutine && currentGroupKey === editingGroupId) {
              task.title = title;
              task.unitPrice = unitPrice;
              task.count = count;
              task.amount = amount;
              task.taxDeduction = taxDeduction;
              task.memo = memo;
              updatedCount++;
            }
          });
        });

        saveData();
        switchRoutineTab('list');
        alert(`루틴 업무 총 ${updatedCount}건의 내용이 수정되었습니다.`);
        return;
      }

      const isPaid = document.getElementById('routineIsPaid').checked;
      const startStr = document.getElementById('routineStartDate').value;
      const endStr = document.getElementById('routineEndDate').value;

      if (!startStr) {
        alert('시작 날짜를 설정해주세요.');
        document.getElementById('routineStartDate').focus();
        return;
      }
      if (!endStr) {
        alert('종료 날짜를 설정해주세요.');
        document.getElementById('routineEndDate').focus();
        return;
      }

      const startDate = parseDateKey(startStr);
      const endDate = parseDateKey(endStr);

      if (startDate > endDate) {
        alert('시작일이 종료일보다 늦을 수 없습니다.');
        return;
      }

      const activeDays = Array.from(document.querySelectorAll('.weekday-pill.active'))
        .map(chip => parseInt(chip.dataset.day, 10));

      if (activeDays.length === 0) {
        alert('최소 1개 이상의 반복 요일을 선택해주세요.');
        return;
      }

      const routineGroupId = 'rg_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6);
      let createdCount = 0;
      let walk = new Date(startDate);

      while (walk <= endDate) {
        if (activeDays.includes(walk.getDay())) {
          const key = formatDateKey(walk);
          if (!tasksData[key]) tasksData[key] = [];
          tasksData[key].push({
            id: 'routine_' + Math.random().toString(36).substring(2, 9),
            routineGroupId: routineGroupId,
            title,
            unitPrice,
            count,
            amount,
            taxDeduction,
            isPaid,
            memo,
            done: false,
            isRoutine: true
          });
          createdCount++;
        }
        walk.setDate(walk.getDate() + 1);
      }

      saveData();
      switchRoutineTab('list');
      alert(`지정한 기간 동안 총 ${createdCount}건의 루틴 업무가 등록되었습니다.`);
    });

    const unpaidModal = document.getElementById('unpaidModalOverlay');

    function isUnpaidModalOpen() {
      return unpaidModal.classList.contains('active');
    }

    function openUnpaidModal() {
      unpaidModal.classList.add('active');
      renderUnpaidModalList();
    }

    function closeUnpaidModal() {
      unpaidModal.classList.remove('active');
    }

    function renderUnpaidModalList() {
      const container = document.getElementById('unpaidTaskList');
      container.innerHTML = '';

      let unpaidList = [];
      let totalUnpaid = 0;

      Object.keys(tasksData).sort().forEach(dateKey => {
        (tasksData[dateKey] || []).forEach(task => {
          if (!task.isPaid) {
            unpaidList.push({ ...task, dateKey });
            totalUnpaid += getTaskEffectiveAmount(task);
          }
        });
      });

      document.getElementById('unpaidModalTotalSum').textContent = `${formatKRW(totalUnpaid)} (${unpaidList.length}건)`;

      if (unpaidList.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:36px; color:var(--text-light); font-size:13px; font-weight:600;">미입금 정산 건이 없습니다.</div>';
        return;
      }

      unpaidList.forEach(task => {
        const item = document.createElement('div');
        item.className = 'task-item-tile';

        const info = document.createElement('div');
        info.style.flex = '1';

        const titleLine = document.createElement('div');
        titleLine.className = 'task-title-line';

        const dateBadge = document.createElement('span');
        dateBadge.className = 'pill-badge';
        dateBadge.textContent = task.dateKey;
        titleLine.appendChild(dateBadge);

        const title = document.createElement('span');
        title.className = 'task-name-text';
        title.textContent = task.title;
        titleLine.appendChild(title);

        info.appendChild(titleLine);

        if (task.memo) {
          const memo = document.createElement('div');
          memo.className = 'task-memo-text';
          memo.textContent = task.memo;
          info.appendChild(memo);
        }

        const bottomMeta = document.createElement('div');
        bottomMeta.className = 'task-bottom-meta';

        const amt = document.createElement('div');
        amt.className = 'task-income-amt';
        const effectiveAmt = getTaskEffectiveAmount(task);
        amt.textContent = formatKRW(effectiveAmt);
        if (task.taxDeduction) {
          const taxSub = document.createElement('span');
          taxSub.style.cssText = 'font-size:11px; margin-left:4px; font-weight:700; font-family:var(--font-mono); color:var(--text-light);';
          taxSub.textContent = '(3.3% 세후)';
          amt.appendChild(taxSub);
        }
        bottomMeta.appendChild(amt);

        const payToggle = document.createElement('label');
        payToggle.className = `payment-check-toggle unpaid`;
        payToggle.title = '클릭하여 입금 완료 상태로 변경';

        const payCheck = document.createElement('input');
        payCheck.type = 'checkbox';
        payCheck.className = 'payment-check-box';
        payCheck.checked = false;
        payCheck.addEventListener('change', () => {
          togglePaymentStatus(task.id, parseDateKey(task.dateKey));
        });

        const payText = document.createElement('span');
        payText.className = 'payment-status-text';
        payText.textContent = '입금 완료 처리';

        payToggle.appendChild(payCheck);
        payToggle.appendChild(payText);
        bottomMeta.appendChild(payToggle);

        info.appendChild(bottomMeta);
        item.appendChild(info);
        container.appendChild(item);
      });
    }

    document.getElementById('openUnpaidModalBtn').addEventListener('click', openUnpaidModal);
    document.getElementById('closeUnpaidModalBtn').addEventListener('click', closeUnpaidModal);
    unpaidModal.addEventListener('click', e => {
      if (e.target.id === 'unpaidModalOverlay') closeUnpaidModal();
    });

    function exportToCSV() {
      const rows = [
        ['날짜', '업무명', '단가(원)', '건수', '총청구액(원)', '원천징수3.3%적용', '세후실수령액(원)', '입금상태', '루틴여부', '메모']
      ];

      const sortedKeys = Object.keys(tasksData).sort();
      let hasData = false;

      sortedKeys.forEach(dateKey => {
        (tasksData[dateKey] || []).forEach(task => {
          hasData = true;
          const unit = task.unitPrice || task.amount || 0;
          const count = task.count || 1;
          const amount = task.amount || 0;
          const isTax = task.taxDeduction ? '적용' : '미적용';
          const net = getTaskEffectiveAmount(task);
          const paidStatus = task.isPaid ? '입금완료' : '미입금';
          const routine = task.isRoutine ? '루틴' : '일반';
          const cleanTitle = `"${String(task.title || '').replace(/"/g, '""')}"`;
          const cleanMemo = `"${String(task.memo || '').replace(/"/g, '""')}"`;

          rows.push([
            dateKey,
            cleanTitle,
            unit,
            count,
            amount,
            isTax,
            net,
            paidStatus,
            routine,
            cleanMemo
          ]);
        });
      });

      if (!hasData) {
        alert('내보낼 장부 데이터가 없습니다.');
        return;
      }

      const csvContent = '\uFEFF' + rows.map(r => r.join(',')).join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const downloadAnchor = document.createElement('a');
      downloadAnchor.href = url;
      downloadAnchor.download = `업무정산_${formatDateKey(new Date())}.csv`;
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      document.body.removeChild(downloadAnchor);
      URL.revokeObjectURL(url);
    }

    document.getElementById('btnExportCSV').addEventListener('click', exportToCSV);
    document.getElementById('btnGoogleLogin').addEventListener('click', handleGoogleLogin);
    document.getElementById('btnLogout').addEventListener('click', handleLogout);

    document.getElementById('keepLoginCheckbox').addEventListener('change', async e => {
      if (!fbAuth) return;

      const persistence = e.target.checked
        ? firebase.auth.Auth.Persistence.LOCAL
        : firebase.auth.Auth.Persistence.SESSION;

      try {
        await fbAuth.setPersistence(persistence);
      } catch (error) {
        console.error('로그인 유지 설정 변경 실패:', error);
        e.target.checked = !e.target.checked;
        alert('로그인 유지 설정을 변경하지 못했습니다.');
      }
    });

    document.getElementById('prevMonthBtn').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });

    document.getElementById('nextMonthBtn').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });

    document.getElementById('todayBtn').addEventListener('click', () => {
      currentDate = new Date();
      selectedDate = new Date();
      updateDashboardStats();
      renderCalendar();
    });

    document.querySelectorAll('.range-selector .btn-preset').forEach(btn => {
      btn.addEventListener('click', e => applyPreset(e.target.dataset.preset));
    });

    const startInput = document.getElementById('rangeStartDate');
    const endInput = document.getElementById('rangeEndDate');

    function handleDateRangeChange() {
      const sVal = startInput.value;
      const eVal = endInput.value;
      if (!sVal || !eVal) return;

      let s = parseDateKey(sVal);
      let e = parseDateKey(eVal);

      if (s > e) {
        e = cloneDate(s);
        endInput.value = formatDateKey(e);
      }

      customStartDate = s;
      customEndDate = e;
      document.querySelectorAll('.range-selector .btn-preset').forEach(btn => btn.classList.remove('active'));
      updateCustomRangeDisplay();
    }

    startInput.addEventListener('change', handleDateRangeChange);
    endInput.addEventListener('change', handleDateRangeChange);

    document.getElementById('drawerCloseBtn').addEventListener('click', closeDrawer);
    document.getElementById('drawerOverlay').addEventListener('click', e => {
      if (e.target.id === 'drawerOverlay') closeDrawer();
    });

    window.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        if (unpaidModal.classList.contains('active')) closeUnpaidModal();
        else if (routineModal.classList.contains('active')) closeRoutineModal();
        else if (isDrawerOpen()) closeDrawer();
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      initTheme();
      applyPreset('4weeks');
      initFirebase();
      renderCalendar();
    });
  </script>
</body>
</html>
